<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aphillips Store — Catalogo</title>

<meta name="theme-color" content="#09090b">
<meta property="og:title" content="Aphillips Store — Catalogo">
<meta property="og:description" content="Relojes disponibles ahora. Toca uno para ver detalles y escribir por WhatsApp.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#f7f7f8;--card:#ffffff;--border:#ececef;--border2:#dedee2;
    --black:#09090b;--text:#18181b;--muted:#71717a;--muted2:#a1a1aa;
    --green:#067647;--green-bg:rgba(6,118,71,0.08);
    --r-lg:14px;--r-md:9px;--r-pill:999px;
    --shadow:0 1px 2px rgba(9,9,11,0.04),0 1px 3px rgba(9,9,11,0.03);
    --shadow-lg:0 8px 24px -6px rgba(9,9,11,0.10),0 2px 6px rgba(9,9,11,0.05);
    --shadow-xl:0 24px 48px -12px rgba(9,9,11,0.20),0 4px 12px rgba(9,9,11,0.08);
    --ease:cubic-bezier(0.32,0.72,0,1);--fast:140ms;--base:220ms;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  header{background:var(--black);padding:22px 20px;text-align:center;position:sticky;top:0;z-index:50;}
  header img{height:26px;}
  .sub{color:rgba(255,255,255,0.5);font-size:12px;margin-top:6px;letter-spacing:0.02em;}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 70px;}
  .search-wrap{margin-bottom:20px;}
  .search-wrap input{width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--r-pill);padding:12px 18px;font-family:inherit;font-size:14px;color:var(--text);outline:none;transition:border-color var(--fast) var(--ease),box-shadow var(--fast) var(--ease);}
  .search-wrap input:focus{border-color:var(--black);box-shadow:0 0 0 3px rgba(9,9,11,0.07);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:box-shadow var(--fast) var(--ease),transform var(--fast) var(--ease);}
  .card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
  .card:active{transform:scale(0.99);}
  .card-foto{width:100%;aspect-ratio:1/1;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .card-foto img{width:100%;height:100%;object-fit:cover;}
  .card-foto .sinfoto{color:var(--muted2);font-size:12px;}
  .card-info{padding:14px 16px;}
  .card-nombre{font-weight:600;font-size:14px;color:var(--black);letter-spacing:-0.01em;line-height:1.3;}
  .card-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .card-precio{font-weight:700;font-size:16px;color:var(--black);margin-top:8px;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
  .empty{text-align:center;padding:70px 20px;color:var(--muted2);font-size:14px;}
  .empty span{display:block;font-size:26px;margin-bottom:10px;opacity:0.4;}

  #modal{display:none;position:fixed;inset:0;background:rgba(9,9,11,0.42);backdrop-filter:blur(4px);z-index:200;align-items:flex-end;justify-content:center;animation:fadeIn var(--base) var(--ease);}
  #modal.open{display:flex;}
  @media(min-width:640px){ #modal{align-items:center;padding:20px;} }
  .modal-box{background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;box-shadow:var(--shadow-xl);animation:slideUp var(--base) var(--ease);}
  @media(min-width:640px){ .modal-box{border-radius:18px;animation:popIn var(--base) var(--ease);} }
  @media(min-width:820px){
    .modal-box{max-width:760px;display:flex;flex-direction:row;align-items:stretch;max-height:82vh;overflow-y:visible;}
    .modal-foto{width:340px;flex-shrink:0;aspect-ratio:auto;height:auto;border-radius:18px 0 0 18px;}
    .modal-body{flex:1;min-width:0;overflow-y:auto;max-height:82vh;}
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  @keyframes popIn{from{opacity:0;transform:scale(0.96) translateY(8px);}to{opacity:1;transform:none;}}
  .modal-foto{width:100%;aspect-ratio:1/1;background:var(--bg);}
  .modal-foto img{width:100%;height:100%;object-fit:cover;}
  .modal-body{padding:20px;}
  .modal-nombre{font-weight:700;font-size:21px;color:var(--black);letter-spacing:-0.02em;line-height:1.2;}
  .modal-sub{font-size:13px;color:var(--muted);margin-top:3px;}
  .modal-precio{font-weight:800;font-size:26px;color:var(--black);margin:14px 0;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
  .specs{margin:16px 0;}
  .spec-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .spec-row span:first-child{color:var(--muted);}
  .spec-row span:last-child{color:var(--black);font-weight:500;text-align:right;}
  .modal-notas{background:var(--bg);border-radius:var(--r-md);padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
  .btn-wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--green);color:#fff;border:none;border-radius:var(--r-md);padding:14px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:transform var(--fast) var(--ease),opacity var(--fast) var(--ease);text-decoration:none;}
  .btn-wa:active{transform:scale(0.98);}
  .btn-cerrar{display:block;text-align:center;color:var(--muted);font-size:13px;padding:14px 0 4px;cursor:pointer;background:none;border:none;width:100%;font-family:inherit;}
  footer{text-align:center;color:var(--muted2);font-size:12px;padding:30px 0 10px;}
</style>
</head>

  <div class="sub">Catalogo — disponibilidad en tiempo real</div>
</header>

<div class="wrap">
  <div class="search-wrap">
    <input type="text" id="buscador" placeholder="Buscar por modelo o coleccion..." oninput="render()" />
  </div>
  <div id="grid" class="grid"></div>
</div>

<footer>Aphillips Store</footer>

<div id="modal">
  <div class="modal-box">
    <div class="modal-foto" id="modal-foto"></div>
    <div class="modal-body">
      <div class="modal-nombre" id="modal-nombre"></div>
      <div class="modal-sub" id="modal-sub"></div>
      <div class="modal-precio" id="modal-precio"></div>
      <div class="specs" id="modal-specs"></div>
      <div class="modal-notas" id="modal-notas" style="display:none;"></div>
      <a class="btn-wa" id="modal-wa" href="#" target="_blank" rel="noopener">Me interesa · escribir por WhatsApp</a>
      <button class="btn-cerrar" onclick="cerrar()">Cerrar</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
<script>
const WHATSAPP_NUM = '50762615442';

const firebaseConfig = {
  apiKey: "AIzaSyCz8cHrafrPGYvp-x9iv1ccFQSobJrFmxo",
  authDomain: "aphillips-store-733df.firebaseapp.com",
  projectId: "aphillips-store-733df",
  storageBucket: "aphillips-store-733df.firebasestorage.app",
  messagingSenderId: "679941981880",
  appId: "1:679941981880:web:f7332e914647ee624dd64d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let relojes = [];

db.collection('catalogo_publico').onSnapshot(function(snap){
  relojes = [];
  snap.forEach(function(doc){
    var d = doc.data(); d.id = doc.id;
    relojes.push(d);
  });
  relojes.sort(function(a,b){ return (b._ts||0)-(a._ts||0); });
  render();
}, function(){
  document.getElementById('grid').innerHTML = '<div class="empty"><span>&#9906;</span>No se pudo cargar el catalogo. Revisa tu conexion.</div>';
});

function render(){
  var q = document.getElementById('buscador').value.toLowerCase();
  var grid = document.getElementById('grid');
  var items = relojes.filter(function(r){
    if(!q) return true;
    return (r.nombre||'').toLowerCase().includes(q) || (r.coleccion||'').toLowerCase().includes(q) || (r.sku||'').toLowerCase().includes(q);
  });
  if(!items.length){
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1;"><span>&#9082;</span>'+(relojes.length?'Sin resultados para tu busqueda.':'No hay relojes disponibles por el momento.')+'</div>';
    return;
  }
  grid.innerHTML = items.map(function(r){
    var foto = r.foto ? '<img src="'+r.foto+'" alt="" onerror="this.parentElement.innerHTML=\'<span class=sinfoto>Sin foto</span>\'" />' : '<span class="sinfoto">Sin foto</span>';
    return '<div class="card" onclick="abrir(\''+r.id+'\')">'+
      '<div class="card-foto">'+foto+'</div>'+
      '<div class="card-info">'+
        '<div class="card-nombre">'+(r.nombre||'')+'</div>'+
        '<div class="card-sub">'+(r.sku?'Ref. '+r.sku:'')+(r.coleccion?(r.sku?' · ':'')+r.coleccion:'')+'</div>'+
        '<div class="card-precio">$'+(r.precio||0).toLocaleString()+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function spec(label, val){
  if(!val) return '';
  return '<div class="spec-row"><span>'+label+'</span><span>'+val+'</span></div>';
}

function abrir(id){
  var r = relojes.find(function(x){ return x.id === id; });
  if(!r) return;
  document.getElementById('modal-foto').innerHTML = r.foto ? '<img src="'+r.foto+'" alt="" />' : '';
  document.getElementById('modal-nombre').textContent = r.nombre || '';
  document.getElementById('modal-sub').textContent = (r.sku?'Ref. '+r.sku:'') + (r.coleccion?(r.sku?' · ':'')+r.coleccion:'');
  document.getElementById('modal-precio').textContent = '$'+(r.precio||0).toLocaleString();
  document.getElementById('modal-specs').innerHTML =
    spec('Genero', r.genero==='hombre'?'Hombre':r.genero==='mujer'?'Mujer':r.genero==='unisex'?'Unisex':'') +
    spec('Diametro', r.mm?r.mm+' mm':'') +
    spec('Material caja', r.materialCaja) +
    spec('Correa / brazalete', r.materialCorrea) +
    spec('Color esfera', r.colorEsfera) +
    spec('Movimiento', r.movimiento) +
    spec('Resistencia agua', r.agua) +
    spec('Cristal', r.cristal) +
    spec('Color / variante', r.color);
  var notasEl = document.getElementById('modal-notas');
  if(r.notas){ notasEl.textContent = r.notas; notasEl.style.display='block'; } else { notasEl.style.display='none'; }
  var msg = encodeURIComponent('Hola! Me interesa el '+(r.nombre||'reloj')+(r.sku?' (Ref. '+r.sku+')':'')+' que vi en el catalogo, ¿sigue disponible?');
  document.getElementById('modal-wa').href = 'https://wa.me/'+WHATSAPP_NUM+'?text='+msg;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function cerrar(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) cerrar(); });
</script>
</body>
</html>
