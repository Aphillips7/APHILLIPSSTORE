<style>
  /* 1. Importación correcta de la tipografía Jost */
  @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap');

  :root{
    --bg:#f7f7f8;--card:#ffffff;--border:#ececef;--border2:#dedee2;
    --black:#09090b;--text:#18181b;--muted:#71717a;--muted2:#a1a1aa;
    --green:#067647;--green-bg:rgba(6,118,71,0.08);
    --blue:#24405f;--blue-bg:rgba(36,64,95,0.08);
    --bronze:#8a6d3a;--bronze-bg:rgba(138,109,58,0.10);
    --gray:#3f3f46;--gray-bg:rgba(63,63,70,0.08);
    --slate:#475569;--slate-bg:rgba(71,85,105,0.09);
    --red:#7a2e3a;--red-bg:rgba(122,46,58,0.08);
    --r-lg:14px;--r-md:9px;--r-pill:999px;
    --shadow:0 1px 2px rgba(9,9,11,0.04),0 1px 3px rgba(9,9,11,0.03);
    --shadow-lg:0 8px 24px -6px rgba(9,9,11,0.10),0 2px 6px rgba(9,9,11,0.05);
    --shadow-xl:0 24px 48px -12px rgba(9,9,11,0.20),0 4px 12px rgba(9,9,11,0.08);
    --ease:cubic-bezier(0.32,0.72,0,1);--fast:140ms;--base:220ms;
  }
  
  *{box-sizing:border-box;margin:0;padding:0;}

  /* 2. Asignación de la fuente a toda la página (body) */
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Jost', 'Futura', Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .fav-count {
    font-size: 10px;
    font-weight: 600;
    color: #24405f; /* Un tono azul oscuro elegante similar a la imagen */
    position: absolute;
    bottom: -2px;
    right: -4px;
    background: #ffffff;
    padding: 0 3px;
    border-radius: 10px;
  }

  header { background: #ffffff; border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top,0px); position: relative; }
  .header-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; max-width: 1200px; margin: 0 auto; }
  .header-left, .header-right { display: flex; align-items: center; gap: 20px; flex: 1; }
  .header-right { justify-content: flex-end; }
  .header-center { flex: 1; display: flex; justify-content: center; }
  .header-center img { height: 26px; filter: invert(1); } 

  .menu-btn, .icon-btn { background: none; border: none; cursor: pointer; color: #333; display: flex; align-items: center; justify-content: center; padding: 4px; transition: color var(--fast) var(--ease); }
  .menu-btn:hover, .icon-btn:hover { color: var(--black); }
  .desktop-link { font-size: 11px; font-weight: 500; letter-spacing: 1px; color: #555; cursor: pointer; text-decoration: none; }
  .desktop-link:hover { color: var(--black); }

  .header-bottom { display: flex; justify-content: center; gap: 32px; padding: 0 24px 16px; max-width: 1200px; margin: 0 auto; }
  .header-bottom a { text-decoration: none; font-size: 11px; font-weight: 500; letter-spacing: 1px; color: #555; transition: all var(--fast) var(--ease); border-bottom: 1px solid transparent; padding-bottom: 2px; }
  .header-bottom a:hover { color: var(--black); border-bottom: 1px solid var(--black); }

  /* Clases para controlar qué se ve en PC vs Celular */
  .mobile-only { display: none !important; }

  /* Ajustes para dispositivos móviles */
  @media (max-width: 820px) {
    .desktop-only, .desktop-link { display: none !important; }
    .mobile-only { display: flex !important; }
    .header-left, .header-right { gap: 12px; }
    .header-top { padding: 14px 16px; }
  }
  .sub{color:rgba(255,255,255,0.5);font-size:12px;margin-top:6px;letter-spacing:0.02em;}

<script>
const WHATSAPP_NUM = '50762615442';

const firebaseConfig = {

actualizarContadorFavoritos();

function actualizarContadorFavoritos(){

  var count = document.getElementById('fav-header-count');
  if(count) count.textContent = n;
  if(btn) btn.classList.toggle('mostrar', n>0);
}
function toggleFavorito(e, id){
  e.stopPropagation();
  var esFav = _favoritos.has(id);
  if(esFav){ _favoritos.delete(id); } else { _favoritos.add(id); vibrar(10); }
  guardarFavoritos();
  document.querySelectorAll('.btn-favorito[data-fav-id="'+id+'"]').forEach(function(b){ b.classList.toggle('activo', !esFav); });
  actualizarContadorFavoritos();

function renderListaFavoritos(){

      '<button class="fav-fila-quitar" onclick="quitarFavorito(\''+r.id+'\')" aria-label="Quitar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M6 6L18 18M18 6L6 18"/></svg></button>'+
    '</div>';
  }).join('');

    btnWa.style.display = 'flex';

  }

function abrirFavoritos(){

  document.getElementById('modal-favoritos').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function cerrarFavoritos(){
  document.getElementById('modal-favoritos').classList.remove('open');
  document.body.style.overflow = '';
}
function quitarFavorito(id){
  _favoritos.delete(id);
  guardarFavoritos();
  document.querySelectorAll('.btn-favorito[data-fav-id="'+id+'"]').forEach(function(b){ b.classList.remove('activo'); });
  actualizarContadorFavoritos();
  renderListaFavoritos();
}
document.getElementById('modal-favoritos').addEventListener('click', function(e){ if(e.target===this) cerrarFavoritos(); });

// =================== CONFIRMACION AL ABRIR WHATSAPP ===================
function confirmarWa(el, e){
  if(el.dataset.animando==='1'){ e.preventDefault(); return; }
  e.preventDefault();
  el.dataset.animando = '1';
  var textoEl = el.querySelector('span');
  var original = textoEl.textContent;
  el.classList.add('confirmando');
  textoEl.textContent = '✓ Abriendo WhatsApp...';
  vibrar(10);
  var href = el.href;
  setTimeout(function(){
    window.open(href, '_blank');
    el.classList.remove('confirmando');
    textoEl.textContent = original;
    el.dataset.animando = '0';
  }, 480);
}
function confirmarWaFavoritos(el, e){
  e.preventDefault();
  if(el.dataset.animando==='1') return;
  var items = relojes.filter(function(r){ return _favoritos.has(r.id); });

  el.dataset.animando = '1';

  el.classList.add('confirmando');

    window.open(url, '_blank');

    el.dataset.animando = '0';
  }, 480);
}

function toggleVistaCompacta(){
  var grid = document.getElementById('grid');
  if(grid) grid.classList.add('vista-cambiando');

    _vistaCompacta = !_vistaCompacta;

    if(btn) btn.classList.toggle('on', _vistaCompacta);
    if(grid){
      grid.classList.toggle('compacta', _vistaCompacta);
      requestAnimationFrame(function(){ grid.classList.remove('vista-cambiando'); });
    }
  }, 180);
}
let _idAbierto = null;
let _deepLinkHandled = false;
const _idInicial = new URLSearchParams(location.search).get('id');
if(_idInicial){ history.replaceState(null, '', location.pathname); }

function textoETA(eta){
  if(!eta) return 'Importacion pendiente';
  var hoy = new Date(); hoy.setHours(0,0,0,0);
  var fecha = new Date(eta+'T00:00:00');
  if(isNaN(fecha.getTime())) return 'Importacion pendiente';
  var dias = Math.round((fecha-hoy)/86400000);
  if(dias<=0) return 'Llegando';
  if(dias===1) return 'Llega mañana';
  return 'Llega en '+dias+' dias';
}

var _vistasContadas = new Set();
function incMetrica(id, campo){
  if(!id) return;
  var upd = {}; upd[campo] = firebase.firestore.FieldValue.increment(1);
  upd['_ultima'] = Date.now();
  db.collection('metricas_catalogo').doc(id).set(upd, {merge:true}).catch(function(){});
}

const _io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    if(en.isIntersecting){
      en.target.classList.add('visible');
      var rid = en.target.getAttribute('data-id');
      if(rid && !_vistasContadas.has(rid)){ _vistasContadas.add(rid); incMetrica(rid,'vistas'); }
      _io.unobserve(en.target);
    }
  });
}, {threshold:0.12, rootMargin:'0px 0px -30px 0px'}) : null;

db.collection('catalogo_publico').onSnapshot(function(snap){
  relojes = [];
  snap.forEach(function(doc){
    var d = doc.data(); d.id = doc.id;
    relojes.push(d);
  });
  relojes.sort(function(a,b){ return (b._ts||0)-(a._ts||0); });
  render();
  if(!_deepLinkHandled){
    _deepLinkHandled = true;
    if(_idInicial){ abrir(_idInicial); }
  }
}, function(){
  document.getElementById('grid').innerHTML = '<div class="empty" style="grid-column:1/-1;"><span>&#9906;</span>No se pudo cargar el catalogo. Revisa tu conexion.</div>';
});

function setGenero(g, btn){
  _filtroGenero = g;
  document.querySelectorAll('#chips-genero .chip').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  render();
}
function setOrden(v){ _orden = v; render(); }

function ordenPeso(estado){
  if(estado==='vendido') return 3;
  if(estado==='bajopedido') return 2;
  if(estado==='transito') return 1;
  return 0;
}

function render(){
  var q = document.getElementById('buscador').value.toLowerCase();
  var grid = document.getElementById('grid');
  var items = relojes.filter(function(r){
    if(q && !((r.nombre||'').toLowerCase().includes(q) || (r.coleccion||'').toLowerCase().includes(q) || (r.sku||'').toLowerCase().includes(q))) return false;
    if(_filtroGenero && r.genero!==_filtroGenero) return false;
    return true;
  });
  items.sort(function(a,b){
    var av = ordenPeso(a.estado), bv = ordenPeso(b.estado);
    if(av!==bv) return av-bv;
    if(_orden==='precio_asc') return (a.precio||0)-(b.precio||0);
    if(_orden==='precio_desc') return (b.precio||0)-(a.precio||0);
    return 0;
  });
  if(!items.length){
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1;"><span>&#9082;</span>'+(relojes.length?'Sin resultados para tu busqueda.':'No hay relojes disponibles por el momento.')+'</div>';
    return;
  }
  grid.innerHTML = items.map(function(r){
    var agotado = r.estado==='vendido';
    var pedido = r.estado==='bajopedido';
    var foto = r.foto ? '<img src="'+r.foto+'" alt="" loading="lazy" onerror="this.parentElement.innerHTML=\'<span class=sinfoto>Sin foto</span>\'" />' : '<span class="sinfoto">Sin foto</span>';
    var badge = r.estado==='transito' ? '<span class="badge-tag camino">'+textoETA(r.eta)+'</span>' : (agotado ? '<span class="badge-tag agotado">Agotado</span>' : (pedido ? '<span class="badge-tag pedido">Bajo pedido</span>' : ''));
    var favBtn = '<button class="btn-favorito'+(_favoritos.has(r.id)?' activo':'')+'" data-fav-id="'+r.id+'" onclick="toggleFavorito(event,\''+r.id+'\')" aria-label="Favorito"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.35-9.33-8.2C1 10.28 1.5 6.8 4.36 5.1 6.6 3.77 9.3 4.5 11 6.3l1 1.05 1-1.05c1.7-1.8 4.4-2.53 6.64-1.2 2.86 1.7 3.36 5.18 1.69 7.7C18.7 16.65 12 21 12 21z"/></svg></button>';
    var precioHtml = pedido ? '<button class="card-cotizar" onclick="event.stopPropagation();cotizarDirecto(\''+r.id+'\')"><svg viewBox="0 0 448 512" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>Cotizar por WhatsApp</button>' : '<div class="card-precio">$'+(r.precio||0).toLocaleString()+'</div>';
    return '<div class="card'+(agotado?' card-agotado':'')+'" data-id="'+r.id+'" onclick="abrir(\''+r.id+'\')">'+
      '<div class="card-foto'+(agotado?' agotada':'')+'">'+badge+favBtn+foto+'</div>'+
      '<div class="card-info">'+
        '<div class="card-nombre">'+(r.nombre||'')+'</div>'+
        '<div class="card-sub">'+(r.sku?'Ref. '+r.sku:'')+(r.coleccion?(r.sku?' · ':'')+r.coleccion:'')+'</div>'+
        precioHtml+
      '</div>'+
    '</div>';
  }).join('');
  var cards = grid.querySelectorAll('.card');
  cards.forEach(function(c){ if(_io){ _io.observe(c); } else { c.classList.add('visible'); } });
}

function spec(label, val){
  if(!val) return '';
  return '<div class="spec-row"><span>'+label+'</span><span>'+val+'</span></div>';
}

function toast(msg){
  var t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

function copiarSku(e, sku){
  e.stopPropagation();
  if(navigator.clipboard){ navigator.clipboard.writeText(sku).then(function(){ toast('SKU copiado: '+sku); }); }
}

function cotizarDirecto(id){
  var r = relojes.find(function(x){ return x.id === id; });
  if(!r) return;
  vibrar(10);
  var msg = encodeURIComponent('Hola! Quiero cotizar el modelo '+(r.nombre||'reloj')+(r.sku?' (Ref. '+r.sku+')':'')+' que vi en el catalogo bajo pedido.');
  incMetrica(id, 'clics');
  window.open('https://wa.me/'+WHATSAPP_NUM+'?text='+msg, '_blank');
}

function abrir(id){
  var r = relojes.find(function(x){ return x.id === id; });
  if(!r) return;
  _idAbierto = id;
  document.getElementById('modal-foto').innerHTML = r.foto ? '<img src="'+r.foto+'" alt="" />' : '';
  var badgeEl = document.getElementById('modal-badge');
  if(r.estado==='transito'){ badgeEl.className='modal-badge camino'; badgeEl.textContent=textoETA(r.eta); badgeEl.style.display='inline-block'; }
  else if(r.estado==='vendido'){ badgeEl.className='modal-badge agotado'; badgeEl.textContent='Agotado'; badgeEl.style.display='inline-block'; }
  else if(r.estado==='bajopedido'){ badgeEl.className='modal-badge pedido'; badgeEl.textContent='Bajo pedido'; badgeEl.style.display='inline-block'; }
  else { badgeEl.style.display='none'; }
  document.getElementById('modal-nombre').textContent = r.nombre || '';
  var skuHtml = r.sku ? '<span class="sku-copy" onclick="copiarSku(event,\''+r.sku.replace(/'/g,"\\'")+'\')" title="Toca para copiar el SKU">Ref. '+r.sku+'</span>' : '';
  var colTxt = r.coleccion ? (r.sku?' · ':'')+r.coleccion : '';
  document.getElementById('modal-sub').innerHTML = skuHtml + colTxt;
  var precioEl = document.getElementById('modal-precio');
  if(r.estado==='bajopedido'){ precioEl.textContent = 'Precio bajo cotizacion'; precioEl.className = 'modal-precio cotizar'; }
  else { precioEl.textContent = '$'+(r.precio||0).toLocaleString(); precioEl.className = 'modal-precio'; }
  document.getElementById('modal-specs').innerHTML =
    spec('Genero', r.genero==='hombre'?'Hombre':r.genero==='mujer'?'Mujer':r.genero==='unisex'?'Unisex':'') +
    spec('Diametro', r.mm?r.mm+' mm':'') +
    spec('Caja', r.materialCaja) +
    spec('Correa', r.materialCorrea) +
    spec('Esfera', r.colorEsfera) +
    spec('Movimiento', r.movimiento) +
    spec('Resistencia agua', r.agua) +
    spec('Cristal', r.cristal) +
    spec('Color', r.color);
  var notasEl = document.getElementById('modal-notas');
  var notasTexto = r.notas || '';
  if(r.estado==='bajopedido'){ notasTexto = (notasTexto?notasTexto+' · ':'')+'Modelo bajo pedido. Entrega estimada en 10-15 dias habiles tras abono inicial.'; }
  if(notasTexto){ notasEl.textContent = notasTexto; notasEl.style.display='block'; } else { notasEl.style.display='none'; }
  var waTexto = document.getElementById('modal-wa-texto');
  var msg;
  if(r.estado==='transito'){
    waTexto.textContent = 'Apartar por WhatsApp';
    msg = encodeURIComponent('Hola! Vi en el catalogo el '+(r.nombre||'reloj')+(r.sku?' (Ref. '+r.sku+')':'')+' que esta en camino, ¿me lo pueden apartar?');
  } else if(r.estado==='vendido'){
    waTexto.textContent = 'Preguntar por uno similar';
    msg = encodeURIComponent('Hola! Vi el '+(r.nombre||'reloj')+(r.sku?' (Ref. '+r.sku+')':'')+' en el catalogo pero ya esta vendido, ¿tienen algo similar o se puede conseguir de nuevo?');
  } else if(r.estado==='bajopedido'){
    waTexto.textContent = 'Cotizar por WhatsApp';
    msg = encodeURIComponent('Hola! Quiero cotizar el modelo '+(r.nombre||'reloj')+(r.sku?' (Ref. '+r.sku+')':'')+' que vi en el catalogo bajo pedido.');
  } else {
    waTexto.textContent = 'Me interesa · escribir por WhatsApp';
    msg = encodeURIComponent('Hola! Me interesa el '+(r.nombre||'reloj')+(r.sku?' (Ref. '+r.sku+')':'')+' que vi en el catalogo, ¿sigue disponible?');
  }
  document.getElementById('modal-wa').href = 'https://wa.me/'+WHATSAPP_NUM+'?text='+msg;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  if(navigator.vibrate){ navigator.vibrate(8); }
  history.pushState({modal:id}, '', '?id='+encodeURIComponent(id));
  incMetrica(id, 'aperturas');
}
function cerrarModalUI(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
  _idAbierto = null;
}
function cerrar(){
  if(history.state && history.state.modal){ history.back(); } else { cerrarModalUI(); }
}
window.addEventListener('popstate', function(){ cerrarModalUI(); });
document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) cerrar(); });
document.getElementById('modal-wa').addEventListener('click', function(){ if(_idAbierto) incMetrica(_idAbierto,'clics'); });
  // === LÓGICA DEL MEGAMENÚ DE BÚSQUEDA ===
  let buscadorAbierto = false;
  
  function toggleBuscador(btnElement) {
    const panel = document.getElementById('search-panel');
    const svgLupa = '<circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>';
    const svgCruz = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';
    
    buscadorAbierto = !buscadorAbierto;
    document.getElementById('site-header').classList.toggle('search-open', buscadorAbierto);
    
    // Cambiar ícono de Lupa a "X"
    const icono = btnElement.querySelector('svg');
    if(buscadorAbierto) {
      panel.classList.add('open');
      icono.innerHTML = svgCruz;
      
      // BLOQUEA EL SCROLL DEL FONDO
      document.body.style.overflow = 'hidden'; 
      
      setTimeout(() => document.getElementById('buscador').focus(), 100);
      cargarBestsellers(); // Cargar productos de muestra
    } else {
      panel.classList.remove('open');
      icono.innerHTML = svgLupa;
      
      // REACTIVA EL SCROLL DEL FONDO AL CERRAR
      document.body.style.overflow = ''; 
    }
  }

  function buscarSugerencia(texto) {
    document.getElementById('buscador').value = texto;
    render(); // Filtra la grilla principal
    toggleBuscador(document.querySelector('.icon-btn[aria-label="Buscar"]')); // Cierra el panel
  }

  function cargarBestsellers() {
    const contenedor = document.getElementById('bestsellers-container');
    if(contenedor.children.length > 0) return; // Verifica si hay relojes reales, ignorando comentarios
    
    // Tomamos hasta 4 relojes al azar (o los primeros) para simular Bestsellers
    const muestras = relojes.slice(0, 4); 
    
    contenedor.innerHTML = muestras.map(r => {
      const precioHtml = r.estado === 'bajopedido' ? 'Consultar' : '$' + (r.precio || 0).toLocaleString();
      const badge = r.estado === 'transito' ? 'EN CAMINO' : 'NUEVO';
      return `
        <div class="bs-card" onclick="abrir('${r.id}')">
          <img src="${r.foto || ''}" onerror="this.style.display='none'" />
          <div class="bs-info">
            <span class="bs-badge">${badge}</span>
            <span class="bs-name">${r.nombre || 'Reloj'}</span>
            <span class="bs-desc">${r.coleccion || 'Exclusivo'}</span>
            <span class="bs-price">${precioHtml}</span>
            <span class="bs-link">Shop now</span>
          </div>
        </div>
      `;
    }).join('');
  }

</script>
<script>
  // === ENCABEZADO TRANSPARENTE SOBRE EL HERO ===
  (function(){
    var header = document.getElementById('site-header');
    var hero = document.getElementById('hero');
    var ticking = false;
    function actualizar(){
      ticking = false;
      if(!header || !hero) return;
      var heroVisible = hero.offsetHeight > 0; // en celular el hero esta oculto
      var limite = hero.offsetHeight - header.offsetHeight;
      header.classList.toggle('on-hero', heroVisible && window.scrollY < limite);
    }
    function onScroll(){ if(!ticking){ ticking = true; requestAnimationFrame(actualizar); } }
    window.addEventListener('scroll', onScroll, {passive:true});
    window.addEventListener('resize', onScroll);
    window.addEventListener('load', actualizar);
    actualizar();
  })();
</script>
