<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-48.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>Página no encontrada — Aphillips Store</title>
<meta name="theme-color" content="#09090b">
<!-- Pagina para direcciones que no existen (wrangler.jsonc: not_found_handling "404-page").
     Rutas absolutas: se muestra en cualquier direccion, por ejemplo /algo/que/no/existe -->
<!-- fuentes de la marca: se piden desde aqui (antes de @import en base.css, que retrasaba el texto) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Syne:wght@700;800&display=swap">
<link rel="stylesheet" href="/css/catalogo/base.css">
<link rel="stylesheet" href="/css/legal.css">
<!-- prueba del azul glaciar como color secundario (?colores=glaciar / ?colores=antes) -->
<script>try{var c=new URLSearchParams(location.search).get('colores');if(c==='glaciar')localStorage.setItem('ap_colores','glaciar');else if(c==='antes')localStorage.removeItem('ap_colores');if(localStorage.getItem('ap_colores')==='glaciar')document.documentElement.classList.add('glaciar');}catch(e){}</script>
<link rel="stylesheet" href="/css/catalogo/glaciar.css">
<style>
  .nf{max-width:560px;margin:0 auto;padding:clamp(48px,10vh,120px) 20px 64px;text-align:center;}
  .nf-num{font-family:var(--font-titulo);font-weight:800;font-size:clamp(64px,14vw,120px);line-height:1;letter-spacing:.02em;color:var(--black);}
  .nf h1{font-family:var(--font-titulo);font-weight:800;font-size:clamp(20px,3vw,26px);text-transform:uppercase;margin:18px 0 10px;}
  .nf p{font-size:15px;line-height:1.6;color:var(--gris-texto);}
  .nf-boton{display:inline-block;margin-top:26px;background:var(--black);color:#fff;text-decoration:none;font-size:var(--fs-etiqueta);font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:16px 28px;}
  .nf-enlaces{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:28px;}
  .nf-enlaces a{font-size:var(--fs-etiqueta);color:var(--black);text-decoration:none;border:1px solid var(--border2);padding:8px 14px;border-radius:999px;}
  @media (hover:hover) and (pointer:fine){ .nf-enlaces a:hover{border-color:var(--black);} }
</style>
</head>
<body class="legal">
<header class="lg-cab">
  <a class="lg-volver" href="/" aria-label="Volver a la tienda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span>Tienda</span></a>
  <a class="lg-logo" href="/"><img src="/img/logo.png" alt="Aphillips Store" height="26"></a>
  <span class="lg-hueco" aria-hidden="true"></span>
</header>
<main class="nf">
  <div class="nf-num" aria-hidden="true">404</div>
  <h1>Esta página no existe</h1>
  <p>Puede que el enlace esté mal escrito o que el reloj ya no esté en la tienda. Te ayudamos a encontrar lo que buscas.</p>
  <a class="nf-boton" href="/">Ver todos los relojes</a>
  <nav class="nf-enlaces" aria-label="Otras secciones">
    <a href="/#hombre">Relojes de hombre</a>
    <a href="/#mujer">Relojes de mujer</a>
    <a href="/guia-de-tamanos">Guía de tamaños</a>
    <a href="/preguntas">Preguntas frecuentes</a>
    <a href="https://wa.me/50762615442?text=Hola%2C%20estoy%20buscando%20un%20reloj" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
  </nav>
</main>
</body>
</html>
